version: 2
updates:
  # The CI outage that prompted this file was an action-config problem
  # (pnpm/action-setup rejecting a `version:` input that duplicated
  # package.json's `packageManager`). Keeping the actions current surfaces that
  # class of breakage as a reviewable PR instead of a red main branch.
  #
  # npm is deliberately NOT watched here: this is a pnpm workspace with three
  # published packages, and per-dependency PRs would be noisy without a
  # lockfile-aware grouping story. Upgrade deps deliberately instead.
  #
  # Grouped into ONE pull request. Ungrouped, the first sweep opened three
  # separate PRs (checkout, setup-node, pnpm/action-setup); all three were green
  # and all three sat unmerged for three weeks — the same "nobody reads the
  # notification" failure mode ci.yml's header describes. One PR is one thing to
  # review. Note `directory: /` already covers BOTH ci.yml and release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
