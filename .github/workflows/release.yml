name: Release

# Publishing is the only moment in this repo where a mistake is expensive: the
# packages are consumed by downstream apps, so a broken publish is visible to
# users and cannot be un-published after 72h. That is why the checks live here
# rather than on every push to main (see ci.yml).
#
# Trigger: the tags `release-it` pushes, e.g. `fluxion-render-v1.6.0`.
on:
  push:
    tags:
      - "fluxion-render-v*"
      - "fluxion-worker-v*"
      - "fluxion-replay-v*"
  # Re-run a failed publish for an existing tag without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. fluxion-render-v1.6.0"
        required: true

permissions:
  contents: read
  # Required for npm provenance — links the published tarball to this workflow
  # run and this commit, and is what lets the token below be a short-lived
  # OIDC-backed credential rather than a long-lived one on someone's laptop.
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No `version:` input on purpose — `packageManager` in package.json is the
      # single source of truth. Specifying BOTH makes pnpm/action-setup abort
      # with "Multiple versions of pnpm specified". Still true on v6.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Keep `cache:` explicit — setup-node v6 limited *automatic* caching
          # to npm, so removing this input loses the pnpm store cache silently.
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Map the tag to the package it names. `fluxion-render-v1.6.0` →
      # directory `packages/fluxion-render`, npm name `@heojeongbo/fluxion-render`.
      - name: Resolve package from tag
        id: pkg
        # Through `env:`, not `${{ }}` inside the script. The workflow_dispatch
        # `tag` input is free text and would otherwise be substituted into the
        # script body before bash parses it — in the one job that holds
        # `id-token: write` and NPM_TOKEN.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          SLUG="${TAG%-v*}"                      # fluxion-render
          VERSION="${TAG##*-v}"                  # 1.6.0
          DIR="packages/$SLUG"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::tag '$TAG' does not map to a package directory ($DIR)"
            exit 1
          fi
          NAME=$(node -p "require('./$DIR/package.json').name")
          PKGVER=$(node -p "require('./$DIR/package.json').version")
          # The tag must match the version committed at that tag, otherwise the
          # tag and the tarball would disagree about what was released.
          if [ "$PKGVER" != "$VERSION" ]; then
            echo "::error::tag says v$VERSION but $DIR/package.json is $PKGVER"
            exit 1
          fi
          # A prerelease must not land on `latest`. The tag globs match
          # `fluxion-render-v2.0.0-beta.1`, and `npm publish` defaults to
          # `latest`, which would hand every `npm i` consumer the beta.
          case "$VERSION" in
            *-*) NPMTAG=next ;;
            *)   NPMTAG=latest ;;
          esac
          echo "dir=$DIR"   >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npmtag=$NPMTAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VERSION from $DIR to dist-tag '$NPMTAG'"

      - run: pnpm install --frozen-lockfile

      # `pnpm -r run <script>` exits 0 when NO package defines the script, so a
      # rename would turn the pre-publish gate below into a green step that ran
      # nothing — on the one path where that is expensive. Assert the scripts
      # exist before relying on them.
      - name: Assert every package defines the gate scripts
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("node:fs");
            const pkgs = ["fluxion-worker", "fluxion-render", "fluxion-replay"];
            const need = ["build", "typecheck", "test", "lint"];
            const bad = [];
            for (const p of pkgs) {
              const s = JSON.parse(readFileSync(`packages/${p}/package.json`)).scripts ?? {};
              for (const n of need) if (!s[n] && n !== "lint") bad.push(`${p}:${n}`);
            }
            if (bad.length) {
              console.error("::error::missing package scripts: " + bad.join(", "));
              process.exit(1);
            }
          '

      # Verify the WHOLE workspace, not just the package being published.
      # `fluxion-replay` peer-depends on any `fluxion-render` 1.x and imports
      # its source in tests, so a render-only gate can ship a render change that
      # breaks replay. Build first: replay resolves render through dist/.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

      # Pack with pnpm, publish with npm — each does the half the other can't.
      # `fluxion-render` depends on `@heojeongbo/fluxion-worker: workspace:^`;
      # only pnpm rewrites that to a real range (verified: -> "^0.6.0"), so a
      # plain `npm publish` would ship an uninstallable package.json. Only npm
      # generates provenance, and it accepts a prebuilt tarball — so pack first,
      # then publish that exact tarball.
      - name: "Pack (rewrites workspace: ranges)"
        id: pack
        run: |
          set -euo pipefail
          # A dedicated directory, not $RUNNER_TEMP itself: that is shared job
          # scratch (setup-node writes its auth .npmrc there), so a stray *.tgz
          # would make the glob below multi-valued.
          OUT="$RUNNER_TEMP/pack"
          mkdir -p "$OUT"
          pnpm pack --pack-destination "$OUT"
          TGZ=$(ls "$OUT"/*.tgz)
          echo "Packed $TGZ"
          node -e "
            const { execSync } = require('node:child_process');
            const raw = execSync('tar -xzOf \"$TGZ\" package/package.json').toString();
            const m = JSON.parse(raw);
            // All four maps, not just 'dependencies'. worker and replay have no
            // 'dependencies' at all, so a dependencies-only check passed them
            // vacuously — and a surviving 'workspace:' in 'peerDependencies' is
            // the dangerous one, since npm 7+ auto-installs peers.
            const maps = ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies'];
            const bad = maps.flatMap((k) =>
              Object.entries(m[k] ?? {}).map(([n, v]) => [k, n, v]),
            ).filter(([, , v]) => String(v).startsWith('workspace:'));
            if (bad.length) {
              console.error('::error::unresolved workspace ranges in the tarball: ' + JSON.stringify(bad));
              process.exit(1);
            }
          "
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
        working-directory: ${{ steps.pkg.outputs.dir }}

      - name: Publish to npm
        run: npm publish "$TGZ" --access public --provenance --tag "$NPMTAG"
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
          NPMTAG: ${{ steps.pkg.outputs.npmtag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### Published \`${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}/v/${{ steps.pkg.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built with provenance from this workflow run." >> "$GITHUB_STEP_SUMMARY"
