name: CI

# Deliberately NOT run on every push to main.
#
# `main` has no branch protection and this repo has never used a pull request —
# every commit lands by direct push. A check that runs after the code is already
# on main gates nothing; it is a notification, and this one demonstrably wasn't
# read (it failed 100% of its runs for three weeks, weekly failure emails
# included, and nothing happened). The checks that actually protect users now
# run where a mistake is expensive: release.yml verifies the whole workspace
# immediately before publishing, and release-it runs the same suite locally
# before it will even create a tag.
#
# What's left here is the clean-environment sweep local development never does:
# a frozen-lockfile install from a fresh checkout, a dependency-ordered build,
# and the examples' typecheck. Weekly catches drift (a transitive dependency, a
# runner image change); `workflow_dispatch` is there for on-demand runs; and
# `pull_request` means the moment PRs are adopted, this becomes a real gate with
# no further changes.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly drift sweep (Mon 06:00 UTC)

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here writes to the repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose — `packageManager` in package.json is the
      # single source of truth. Specifying BOTH makes pnpm/action-setup abort
      # with "Multiple versions of pnpm specified". Still true on v6.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Keep `cache:` explicit. setup-node v6 limited *automatic* caching to
          # npm, so dropping this input silently loses the pnpm store cache
          # rather than erroring.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build is dependency-ordered and MUST precede tests/typecheck: the
      # example apps and cross-package tests resolve workspace packages via dist/.
      - run: pnpm build

      - run: pnpm typecheck

      # All three packages run WITH coverage, so the thresholds in each
      # vitest.config.ts guard every change instead of only a weekly sweep.
      #
      # replay used to be quarantined to a separate schedule-only job because
      # its coverage run took 40s and `scenarios/09-*.test.ts` timed out inside
      # it. That was never v8 being slow — `ReplayPlayer` re-queried IndexedDB
      # on every animation frame, so cost scaled with simulated playback time.
      # With that fixed the run is ~11s and the quarantine has no reason to
      # exist; the job is gone and replay is gated on every PR like the others.
      #
      # NOTE the `-C <dir>` form. `pnpm --filter <pkg> run <script>` exits 0
      # when the filter matches nothing OR the script is missing — a rename
      # anywhere turns these into green checks that ran nothing (verified).
      # `pnpm -C <dir> run <script>` exits 1 with ERR_PNPM_NO_SCRIPT instead.
      - run: pnpm -C packages/fluxion-render run test:coverage
      - run: pnpm -C packages/fluxion-worker run test:coverage
      - run: pnpm -C packages/fluxion-replay run test:coverage

      - run: pnpm lint
