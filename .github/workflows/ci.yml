name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly coverage sweep (Mon 06:00 UTC)

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build is dependency-ordered and MUST precede tests/typecheck: the
      # example apps and cross-package tests resolve workspace packages via dist/.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

  # Per-package coverage runs on a schedule / manual trigger — it is the slow
  # path (v8 instrumentation) and the 100%-line contract is what it guards.
  coverage:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @heojeongbo/fluxion-render vitest run --coverage
      - run: pnpm --filter @heojeongbo/fluxion-worker vitest run --coverage
      - run: pnpm --filter @heojeongbo/fluxion-replay vitest run --coverage
